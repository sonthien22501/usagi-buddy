<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usagi Buddy Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        overflow-x: hidden !important;
      }

      body {
        min-height: 100vh;
        background: #140f1d;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Nunito", sans-serif;
        padding: 18px 20px 24px;
        overflow-y: auto;
        overflow-x: hidden !important;
      }

      /* Completely eradicate horizontal scrollbar */
      ::-webkit-scrollbar:horizontal {
        display: none !important;
        height: 0px !important;
        width: 0px !important;
      }

      /* Discreet, modern vertical scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 0px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 234, 167, 0.22);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 234, 167, 0.45);
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255, 234, 167, 0.16);
      }

      .app-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .app-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .app-header-text h1 {
        font-size: 19px;
        font-weight: 800;
        color: #ffeaa7;
        letter-spacing: 0.3px;
      }

      .app-header-text p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 2px;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 16px;
        padding: 16px 18px;
        margin-bottom: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .card-title {
        font-size: 13.5px;
        font-weight: 700;
        color: #fab1a0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        background: rgba(255, 234, 167, 0.16);
        color: #ffeaa7;
        padding: 3px 9px;
        border-radius: 10px;
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }

      /* Unified Left & Right Slider with Dynamic Track Fill & Grey Inactive */
      .slider-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .volume-slider {
        -webkit-appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(
          to right,
          #ff7675 0%,
          #ffeaa7 80%,
          rgba(255, 255, 255, 0.16) 80%,
          rgba(255, 255, 255, 0.16) 100%
        );
        outline: none;
        cursor: pointer;
        transition: background 0.05s ease;
      }

      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid #ff7675;
        cursor: grab;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        transition: transform 0.1s, box-shadow 0.1s;
      }

      .volume-slider::-webkit-slider-thumb:hover {
        transform: scale(1.15);
        box-shadow: 0 0 10px rgba(255, 118, 117, 0.7);
      }

      .volume-slider::-webkit-slider-thumb:active {
        cursor: grabbing;
        transform: scale(1.22);
      }

      .card-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      /* Equal, Identical Action Buttons */
      .btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #ffffff;
        padding: 7px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      .btn:hover {
        background: rgba(255, 234, 167, 0.22);
        border-color: #ffeaa7;
        color: #ffeaa7;
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn-action-pair {
        width: 120px;
        height: 36px;
      }

      .feature-btn {
        width: 135px;
        height: 36px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      .feature-btn:hover {
        background: rgba(255, 234, 167, 0.22);
        border-color: #ffeaa7;
        color: #ffeaa7;
      }

      .feature-btn:active {
        transform: scale(0.96);
      }

      .feature-btn.active {
        background: rgba(255, 118, 117, 0.22);
        border-color: #ff7675;
        color: #ff7675;
      }

      .btn-primary {
        background: linear-gradient(135deg, #ff7675, #d63031);
        border: none;
        color: #ffffff;
        font-weight: 800;
        box-shadow: 0 3px 10px rgba(214, 48, 49, 0.35);
      }

      .btn-primary:hover {
        filter: brightness(1.1);
        border: none;
        color: #ffffff;
      }

      /* Pomodoro Timer Display */
      .clock-display {
        text-align: center;
        padding: 6px 0 12px;
      }

      .clock-time {
        font-size: 38px;
        font-weight: 900;
        color: #ffeaa7;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 20px rgba(255, 234, 167, 0.3);
      }

      .clock-status {
        font-size: 11.5px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        margin-top: 3px;
      }

      .preset-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        justify-content: center;
      }

      .chip-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #ffeaa7;
        padding: 6px 12px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.12s ease;
      }

      .chip-btn:hover {
        background: #ff7675;
        color: #ffffff;
        border-color: #ff7675;
        transform: translateY(-1px);
      }

      .input-group {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }

      .number-input {
        flex: 1;
        height: 36px;
        background: rgba(0, 0, 0, 0.35);
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #ffffff;
        font-size: 14px;
        font-weight: bold;
        padding: 0 12px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        -moz-appearance: textfield !important;
        appearance: textfield !important;
      }

      .number-input::-webkit-inner-spin-button,
      .number-input::-webkit-outer-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
      }

      .number-input:focus {
        border-color: #ffeaa7;
      }

      .unit-select {
        height: 36px;
        background: rgba(0, 0, 0, 0.45);
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        padding: 0 10px;
        outline: none;
        cursor: pointer;
      }

      /* Clean Mode Rows (No small descriptions) */
      .mode-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .mode-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .mode-item:last-child {
        padding-bottom: 0;
        border-bottom: none;
      }

      .mode-title {
        font-size: 13.5px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .app-footer {
        text-align: center;
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <div class="app-header">
      <div class="app-logo">
        <img src="../assets/Usagi_logo.png" alt="Usagi Logo" />
      </div>
      <div class="app-header-text">
        <h1>Usagi Buddy Dashboard</h1>
        <p>Unified Controls & Focus Companion</p>
      </div>
    </div>

    <!-- 1. Unified Volume Card -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔊 Sound Volume</div>
        <span class="badge" id="volume-val-badge">80%</span>
      </div>
      <div class="slider-row">
        <span style="font-size: 14px">🔈</span>
        <input
          type="range"
          class="volume-slider"
          id="volume-slider"
          min="0"
          max="100"
          value="80"
          step="1"
        />
        <span style="font-size: 14px">🔊</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-action-pair" id="test-sound-btn">🎵 Test Sound</button>
        <button class="btn btn-action-pair" id="mute-toggle-btn">🔇 Mute</button>
      </div>
    </div>

    <!-- 2. Pomodoro Focus Timer Card -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🍅 Custom Focus Timer</div>
        <span class="badge" id="timer-badge">25:00 IDLE</span>
      </div>

      <div class="clock-display">
        <div class="clock-time" id="clock-time">25:00</div>
        <div class="clock-status" id="clock-status">READY TO FOCUS</div>
      </div>

      <!-- Quick Preset Chips -->
      <div class="preset-chips">
        <button class="chip-btn" data-min="25">25m Standard</button>
        <button class="chip-btn" data-min="40">40m Extended</button>
        <button class="chip-btn" data-min="60">60m (1h)</button>
        <button class="chip-btn" data-min="90">90m</button>
        <button class="chip-btn" data-hours="2">2h</button>
      </div>

      <!-- Manual Input Row -->
      <div class="input-group">
        <input
          type="number"
          class="number-input"
          id="manual-time-input"
          min="1"
          max="720"
          value="40"
          placeholder="e.g. 40"
        />
        <select class="unit-select" id="manual-unit-select">
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
        </select>
        <button class="btn btn-primary" id="start-timer-btn" style="width: 85px; height: 36px">▶ Start</button>
      </div>

      <div class="card-actions" style="margin-top: 8px">
        <button class="btn btn-action-pair" id="pause-timer-btn">⏸ Pause</button>
        <button class="btn btn-action-pair" id="reset-timer-btn">🔄 Reset</button>
      </div>
    </div>

    <!-- 3. Companion Modes & Actions Card (Clean & Equal Buttons) -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🎮 Companion Modes & Actions</div>
      </div>
      <div class="mode-list">
        <!-- Stay Still -->
        <div class="mode-item">
          <div class="mode-title">📌 Stay Still</div>
          <button class="feature-btn" id="stationary-toggle-btn">📌 Pin Still</button>
        </div>

        <!-- Play Mode / Follow Cursor -->
        <div class="mode-item">
          <div class="mode-title">🪄 Play Mode</div>
          <button class="feature-btn" id="play-mode-toggle-btn">🪄 Follow Mouse</button>
        </div>

        <!-- Ghost Mode / Click-Through -->
        <div class="mode-item">
          <div class="mode-title">👻 Ghost Mode</div>
          <button class="feature-btn" id="ghost-mode-toggle-btn">👻 Ghost Mode</button>
        </div>

        <!-- Drop Pudding Snack -->
        <div class="mode-item">
          <div class="mode-title">🍮 Pudding Snack</div>
          <button class="feature-btn" id="drop-snack-btn">🍮 Drop Snack</button>
        </div>
      </div>
    </div>

    <!-- App Footer -->
    <div class="app-footer">
      💡 Close this window anytime (✕) — Usagi stays happily floating in the background!
    </div>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>

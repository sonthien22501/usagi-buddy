<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usagi Sticky Quests</title>
    <style>
      :root,
      [data-theme='custard'] {
        --bg-sticky: #fffdf5;
        --bg-header: #ffe699;
        --border-color: #5c3a21;
        --text-color: #5c3a21;
        --text-muted: #8b6247;
        --accent-color: #ff8fa3;
        --accent-hover: #ff758f;
        --card-bg: #ffffff;
        --item-hover: #fff3d6;
        --shadow-color: #e6c88a;
        --done-color: #b0a390;
        --card-inner: #fff0c2;
        --badge-bg: #ffe699;
        --badge-text: #5c3a21;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        padding: 5px;
      }

      .sticky-card {
        width: 100%;
        height: 100%;
        background: var(--bg-sticky);
        border: 2.5px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 4px 0 var(--shadow-color), 0 8px 16px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .kawaii-svg {
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .kawaii-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .sticky-header {
        -webkit-app-region: drag;
        background: var(--bg-header);
        border-bottom: 2px solid var(--border-color);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: grab;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 800;
        color: var(--text-color);
        letter-spacing: 0.3px;
      }

      .header-title .icon {
        font-size: 15px;
      }

      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-icon {
        background: transparent;
        border: none;
        color: var(--text-color);
        width: 22px;
        height: 22px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        transition: background 0.15s ease, transform 0.1s ease;
      }

      .btn-icon:hover {
        background: rgba(0, 0, 0, 0.08);
        transform: scale(1.05);
      }

      .btn-icon:active {
        transform: scale(0.95);
      }

      .input-bar {
        padding: 8px 10px;
        display: flex;
        gap: 6px;
        background: var(--bg-sticky);
        border-bottom: 1.5px dashed var(--border-color);
      }

      .input-text {
        flex: 1;
        padding: 6px 10px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 12px;
        background: var(--card-bg);
        color: var(--text-color);
        outline: none;
        transition: border-color 0.15s ease;
      }

      .input-text:focus {
        border-color: var(--accent-color);
      }

      .btn-add {
        background: var(--accent-color);
        color: #ffffff;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--border-color);
        transition: background 0.15s ease, transform 0.08s ease;
      }

      .btn-add:hover {
        background: var(--accent-hover);
      }

      .btn-add:active {
        transform: translateY(2px);
        box-shadow: none;
      }

      .quest-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .quest-list::-webkit-scrollbar {
        width: 5px;
      }
      .quest-list::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      .quest-item {
        background: var(--card-bg);
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        position: relative;
        transition: background 0.15s ease;
      }

      .quest-item:hover {
        background: var(--item-hover);
      }

      .quest-bullet {
        flex-shrink: 0;
        width: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--accent-color);
      }

      .quest-text {
        position: relative;
        flex: 1;
        font-size: 12px;
        color: var(--text-color);
        word-break: break-word;
        transition: color 0.15s ease, text-decoration 0.15s ease;
        line-height: 1.3;
      }

      .comfy-line {
        height: 3px;
        border-radius: 999px;
        background: var(--accent-color);
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 0%;
        transition: width 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
      }

      .quest-item.completed .comfy-line {
        width: 100%;
      }

      .quest-item.completed .quest-text {
        color: var(--done-color);
      }

      .quest-delete {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        opacity: 0.6;
        padding: 2px 4px;
        border-radius: 4px;
        transition: opacity 0.15s ease, color 0.15s ease;
      }

      .quest-delete:hover {
        opacity: 1;
        color: #e63946;
      }

      .empty-state {
        text-align: center;
        padding: 30px 10px;
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .empty-state .emoji {
        font-size: 24px;
        margin-bottom: 4px;
      }

      .sticky-footer {
        padding: 6px 10px;
        background: var(--bg-sticky);
        border-top: 1.5px dashed var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
      }

      .btn-clear {
        background: transparent;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-color);
        cursor: pointer;
        transition: background 0.15s ease, transform 0.08s ease;
      }

      .btn-clear:hover {
        background: var(--item-hover);
      }

      .btn-clear:active {
        transform: scale(0.96);
      }

      /* 2-Tab Switcher & Calendar Styles */
      .sticky-tabs {
        display: flex;
        background: var(--card-inner);
        border-bottom: 1.5px solid var(--border-color);
        padding: 4px 6px;
        gap: 6px;
      }
      .sticky-tab-btn {
        flex: 1;
        border: 1.5px solid transparent;
        border-radius: 6px;
        padding: 4px;
        font-size: 11px;
        font-weight: 700;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .sticky-tab-btn.active {
        background: var(--bg-sticky);
        border-color: var(--border-color);
        color: var(--text-color);
        font-weight: 800;
      }
      .view-container {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .sticky-chip-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: var(--bg-sticky);
        border-bottom: 1px dashed var(--border-color);
        font-size: 10px;
        flex-wrap: wrap;
      }
      .sticky-chip-btn {
        background: var(--card-inner);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-color);
        cursor: pointer;
      }
      .sticky-chip-btn:hover {
        background: var(--badge-bg);
      }
      .sticky-chip-btn.active {
        background: var(--accent-color);
        color: #fff;
      }
      .quest-due-badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 4px;
        font-size: 9px;
        font-weight: 800;
        border-radius: 4px;
        background: var(--badge-bg);
        color: var(--badge-text);
        border: 1px solid var(--border-color);
        margin-left: 4px;
        vertical-align: middle;
      }
      /* Mini calendar inside sticky note */
      .cal-sticky-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cal-sticky-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .cal-sticky-scroll::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      .cal-nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .cal-nav-btn {
        background: var(--card-inner);
        border: 1.5px solid var(--border-color);
        color: var(--text-color);
        border-radius: 5px;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .cal-nav-btn:hover {
        background: var(--badge-bg);
      }
      .cal-weekdays-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 9px;
        font-weight: 800;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      .cal-days-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .cal-day-cell {
        min-height: 24px;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        position: relative;
        border: 1px solid transparent;
        background: var(--card-bg);
        color: var(--text-color);
        padding: 1px 0;
      }
      .cal-day-cell:hover {
        background: var(--item-hover);
      }
      .cal-day-cell.not-current-month {
        opacity: 0.35;
      }
      .cal-day-cell.today {
        border-color: #e6a15c !important;
        font-weight: 900;
        box-shadow: inset 0 0 0 1px #e6a15c;
      }
      .cal-day-cell.selected {
        background: var(--badge-bg) !important;
        border-color: var(--accent-color) !important;
      }
      .cal-dots {
        display: flex;
        gap: 2px;
        align-items: center;
        justify-content: center;
        height: 4px;
        margin-top: 1px;
      }
      .dot-quest {
        width: 3.5px;
        height: 3.5px;
        border-radius: 50%;
        background: #d97706;
      }
      .dot-holiday {
        width: 3.5px;
        height: 3.5px;
        border-radius: 50%;
        background: #ff758f;
      }
      .dot-bday {
        font-size: 7px;
        line-height: 1;
        color: #f59e0b;
      }
      .upcoming-item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px;
        border-radius: 5px;
        font-size: 10px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
      }
      .upcoming-badge {
        font-size: 8.5px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--accent-color);
        color: #ffffff;
      }
    </style>
  </head>
  <body data-theme="custard">
    <div class="sticky-card">
      <div class="sticky-header">
        <div class="header-title">
          <span class="icon">🍮</span>
          <span>Usagi Quests</span>
        </div>
        <div class="header-actions">
          <button id="minimizeBtn" class="btn-icon" title="Hide Note">✕</button>
        </div>
      </div>

      <!-- 2-Tab Switcher -->
      <div class="sticky-tabs">
        <button class="sticky-tab-btn active" id="tabBtnQuests">📝 Quests</button>
        <button class="sticky-tab-btn" id="tabBtnCalendar">📅 Calendar</button>
      </div>

      <!-- Tab 1: Quests View -->
      <div class="view-container" id="viewQuests">
        <div class="input-bar">
          <input
            id="questInput"
            type="text"
            class="input-text"
            placeholder="Add quest (or '@tomorrow', '@+3d')..."
            maxlength="120"
          />
          <button id="addQuestBtn" class="btn-add">+</button>
        </div>

        <div class="sticky-chip-row">
          <button class="sticky-chip-btn" data-sticky-chip="today">Today</button>
          <button class="sticky-chip-btn" data-sticky-chip="tomorrow">Tmrw</button>
          <button class="sticky-chip-btn" id="stickyChipClearDate" style="display: none;">✕ Clear Date</button>
          <span style="margin-left: auto; color: var(--text-muted); font-size: 9px; opacity: 0.8;">@today / @tmrw</span>
        </div>

        <div id="questList" class="quest-list">
          <!-- Rendered items -->
        </div>

        <div class="sticky-footer">
          <span id="questCounter">0/0 completed</span>
          <button id="clearDoneBtn" class="btn-clear">Clear Done</button>
        </div>
      </div>

      <!-- Tab 2: Calendar View -->
      <div class="view-container" id="viewCalendar" style="display: none;">
        <div class="cal-sticky-scroll">
          <div class="cal-nav-bar">
            <button class="cal-nav-btn" id="stickyCalPrevBtn">‹</button>
            <span id="stickyCalMonthTitle" style="font-weight: 800; font-size: 11px; color: var(--text-color);">November 2026</span>
            <div style="display: flex; gap: 4px;">
              <button class="cal-nav-btn" id="stickyCalTodayBtn" style="font-size: 9px; padding: 2px 6px; width: auto; font-weight: 700;">Today</button>
              <button class="cal-nav-btn" id="stickyCalNextBtn">›</button>
            </div>
          </div>
          <div class="cal-weekdays-grid">
            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
          </div>
          <div id="stickyCalDaysGrid" class="cal-days-grid">
            <!-- 42 day cells -->
          </div>

          <!-- Selected Day Banner & Add Quest Button -->
          <div id="stickyCalDetailBanner" style="display: none; padding: 6px 8px; border-radius: 6px; font-size: 10px; background: var(--card-inner); border: 1px dashed var(--border-color); flex-direction: column; gap: 4px;">
            <div id="stickyCalDetailText" style="font-weight: 700; color: var(--text-color);"></div>
            <div id="stickyCalEventText" style="font-size: 9.5px; color: var(--accent-color); font-weight: 800;"></div>
            <button id="stickyCalJumpAddBtn" class="sticky-chip-btn" style="align-self: flex-start; margin-top: 2px;">+ Add Quest on Date</button>
          </div>

          <!-- Upcoming Countdown Feed -->
          <div style="margin-top: 4px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 10px; font-weight: 800; color: var(--text-color);">
              <span>Upcoming</span>
              <span style="font-size: 9px; opacity: 0.7;">Countdown</span>
            </div>
            <div id="stickyUpcomingList" style="display: flex; flex-direction: column; gap: 3px;">
              <!-- Upcoming items -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./sticky.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usagi Sticky Quests</title>
    <style>
      :root,
      [data-theme='custard'] {
        --bg-sticky: #fffdf5;
        --bg-header: #ffe699;
        --border-color: #5c3a21;
        --text-color: #5c3a21;
        --text-muted: #8b6247;
        --accent-color: #ff8fa3;
        --accent-hover: #ff758f;
        --card-bg: #ffffff;
        --item-hover: #fff3d6;
        --shadow-color: #e6c88a;
        --done-color: #b0a390;
        --card-inner: #fff0c2;
        --badge-bg: #ffe699;
        --badge-text: #5c3a21;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans JP',
          sans-serif;
        padding: 5px;
      }

      .sticky-card {
        width: 100%;
        height: 100%;
        position: relative;
        --font-scale: 1.12;
        background: var(--bg-sticky);
        border: 2.5px solid var(--border-color);
        border-radius: 16px;
        box-shadow:
          0 4px 0 var(--shadow-color),
          0 8px 16px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      body[data-font-scale='sm'] .sticky-card,
      [data-font-scale='sm'] {
        --font-scale: 1;
      }

      body[data-font-scale='md'] .sticky-card,
      [data-font-scale='md'] {
        --font-scale: 1.12;
      }

      body[data-font-scale='lg'] .sticky-card,
      [data-font-scale='lg'] {
        --font-scale: 1.26;
      }

      .sticky-resize-edge-right {
        position: absolute;
        top: 0;
        right: 0;
        width: 8px;
        height: 100%;
        cursor: ew-resize;
        z-index: 20;
        -webkit-app-region: no-drag;
      }

      .sticky-resize-edge-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 8px;
        cursor: ns-resize;
        z-index: 20;
        -webkit-app-region: no-drag;
      }

      .sticky-resize-corner {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 24px;
        height: 24px;
        cursor: nwse-resize;
        z-index: 25;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding-right: 5px;
        padding-bottom: 5px;
        -webkit-app-region: no-drag;
      }

      .sticky-resize-corner .sticky-resize-grip {
        width: 12px;
        height: 12px;
        opacity: 0.5;
        pointer-events: none;
      }

      .sticky-resize-corner:hover .sticky-resize-grip {
        opacity: 0.9;
      }

      .sched-entry-card {
        background: var(--card-bg);
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: calc(11px * var(--font-scale));
        position: relative;
        transition: background 0.15s ease;
      }

      .sched-entry-card:hover {
        background: var(--item-hover);
      }

      .sched-time-pill {
        font-size: calc(9.5px * var(--font-scale));
        font-weight: 800;
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--card-inner);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        white-space: nowrap;
      }

      .sched-title {
        font-weight: 700;
        color: var(--text-color);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sched-location {
        font-size: calc(9.5px * var(--font-scale));
        color: var(--text-muted);
        background: var(--card-inner);
        border-radius: 4px;
        padding: 1px 4px;
        white-space: nowrap;
      }

      .sched-delete-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 4px;
        border-radius: 4px;
        opacity: 0.6;
        transition:
          opacity 0.15s,
          color 0.15s;
      }

      .sched-delete-btn:hover {
        opacity: 1;
        color: #e63946;
      }

      .kawaii-svg {
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .kawaii-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .sticky-header {
        -webkit-app-region: drag;
        background: var(--bg-header);
        border-bottom: 2px solid var(--border-color);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: grab;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: calc(13px * var(--font-scale));
        font-weight: 800;
        color: var(--text-color);
        letter-spacing: 0.3px;
      }

      .header-title .icon {
        font-size: 15px;
      }

      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-icon {
        background: transparent;
        border: none;
        color: var(--text-color);
        width: 22px;
        height: 22px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }

      .btn-icon:hover {
        background: rgba(0, 0, 0, 0.08);
        transform: scale(1.05);
      }

      .btn-icon:active {
        transform: scale(0.95);
      }

      .input-bar {
        padding: 8px 10px;
        display: flex;
        gap: 6px;
        background: var(--bg-sticky);
        border-bottom: 1.5px dashed var(--border-color);
      }

      .input-text {
        flex: 1;
        padding: 6px 10px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: calc(12.5px * var(--font-scale));
        background: var(--card-bg);
        color: var(--text-color);
        outline: none;
        transition: border-color 0.15s ease;
      }

      .input-text:focus {
        border-color: var(--accent-color);
      }

      .btn-add {
        background: var(--accent-color);
        color: #ffffff;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--border-color);
        transition:
          background 0.15s ease,
          transform 0.08s ease;
      }

      .btn-add:hover {
        background: var(--accent-hover);
      }

      .btn-add:active {
        transform: translateY(2px);
        box-shadow: none;
      }

      .quest-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .quest-list::-webkit-scrollbar {
        width: 5px;
      }
      .quest-list::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      .quest-item {
        background: var(--card-bg);
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        position: relative;
        transition: background 0.15s ease;
      }

      .quest-item:hover {
        background: var(--item-hover);
      }

      .quest-bullet {
        flex-shrink: 0;
        width: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--accent-color);
      }

      .quest-text {
        position: relative;
        flex: 1;
        font-size: calc(12.5px * var(--font-scale));
        color: var(--text-color);
        word-break: break-word;
        transition:
          color 0.15s ease,
          text-decoration 0.15s ease;
        line-height: 1.3;
      }

      .comfy-line {
        height: 3px;
        border-radius: 999px;
        background: var(--accent-color);
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 0%;
        transition: width 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
      }

      .quest-item.completed .comfy-line {
        width: 100%;
      }

      .quest-item.completed .quest-text {
        color: var(--done-color);
      }

      .quest-delete {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        opacity: 0.6;
        padding: 2px 4px;
        border-radius: 4px;
        transition:
          opacity 0.15s ease,
          color 0.15s ease;
      }

      .quest-delete:hover {
        opacity: 1;
        color: #e63946;
      }

      .empty-state {
        text-align: center;
        padding: 30px 10px;
        font-size: calc(12px * var(--font-scale));
        color: var(--text-muted);
        line-height: 1.6;
      }

      .empty-state .emoji {
        font-size: 24px;
        margin-bottom: 4px;
      }

      .sticky-footer {
        padding: 6px 10px;
        background: var(--bg-sticky);
        border-top: 1.5px dashed var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: calc(11px * var(--font-scale));
        color: var(--text-muted);
        font-weight: 600;
      }

      .btn-clear {
        background: transparent;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: calc(10px * var(--font-scale));
        font-weight: 700;
        color: var(--text-color);
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.08s ease;
      }

      .btn-clear:hover {
        background: var(--item-hover);
      }

      .btn-clear:active {
        transform: scale(0.96);
      }

      /* 2-Tab Switcher & Calendar Styles */
      .sticky-tabs {
        display: flex;
        background: var(--card-inner);
        border-bottom: 1.5px solid var(--border-color);
        padding: 4px 6px;
        gap: 6px;
      }
      .sticky-tab-btn {
        flex: 1;
        border: 1.5px solid transparent;
        border-radius: 6px;
        padding: 4px;
        font-size: calc(11px * var(--font-scale));
        font-weight: 700;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .sticky-tab-btn.active {
        background: var(--bg-sticky);
        border-color: var(--border-color);
        color: var(--text-color);
        font-weight: 800;
      }
      .view-container {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .sticky-chip-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: var(--bg-sticky);
        border-bottom: 1px dashed var(--border-color);
        font-size: calc(10px * var(--font-scale));
        flex-wrap: wrap;
      }
      .sticky-chip-btn {
        background: var(--card-inner);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: calc(10px * var(--font-scale));
        font-weight: 700;
        color: var(--text-color);
        cursor: pointer;
      }
      .sticky-chip-btn:hover {
        background: var(--badge-bg);
      }
      .sticky-chip-btn.active {
        background: var(--accent-color);
        color: #fff;
      }
      .quest-due-badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 4px;
        font-size: calc(9.5px * var(--font-scale));
        font-weight: 800;
        border-radius: 4px;
        background: var(--badge-bg);
        color: var(--badge-text);
        border: 1px solid var(--border-color);
        margin-left: 4px;
        vertical-align: middle;
      }
      .quest-item.focus-active,
      .reminder-item.focus-active {
        border-color: #f59e0b;
        box-shadow:
          0 0 0 1.5px #f59e0b,
          0 2px 6px rgba(245, 158, 11, 0.25);
        background: #fffdf0;
      }
      .quest-focus-btn {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 1px 3px;
        font-size: calc(11px * var(--font-scale));
        cursor: pointer;
        opacity: 0.65;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .quest-focus-btn:hover {
        opacity: 1;
        transform: scale(1.1);
        background: rgba(239, 68, 68, 0.1);
      }
      .quest-focus-btn.active {
        opacity: 1;
        background: #fee2e2;
        border-color: #ef4444;
      }
      .quest-pomo-pill {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: calc(9.5px * var(--font-scale));
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 999px;
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
        margin-left: 5px;
        vertical-align: middle;
      }
      .subtask-toggle-btn {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: calc(9px * var(--font-scale));
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 999px;
        background: var(--card-inner);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        cursor: pointer;
        margin-left: 5px;
        vertical-align: middle;
        transition: all 0.15s ease;
      }
      .subtask-toggle-btn:hover {
        background: var(--badge-bg);
      }
      .quest-container {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .subtasks-panel {
        margin-left: 20px;
        padding: 4px 6px;
        background: var(--item-hover);
        border-left: 2.5px solid var(--border-color);
        border-radius: 0 0 6px 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .subtask-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: calc(11px * var(--font-scale));
        color: var(--text-color);
        cursor: pointer;
      }
      .subtask-item.completed {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .subtask-check {
        width: 12px;
        height: 12px;
        cursor: pointer;
        accent-color: var(--accent-color);
      }
      .subtask-text {
        flex: 1;
        word-break: break-word;
      }
      .subtask-del-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 10px;
        opacity: 0.5;
        padding: 0 3px;
      }
      .subtask-del-btn:hover {
        opacity: 1;
        color: #e63946;
      }
      .subtask-add-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 2px;
      }
      .subtask-input {
        flex: 1;
        font-size: calc(10px * var(--font-scale));
        padding: 2px 6px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--card-bg);
        color: var(--text-color);
        outline: none;
      }
      .subtask-input:focus {
        border-color: var(--accent-color);
      }
      /* Mini calendar inside sticky note */
      .cal-sticky-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cal-sticky-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .cal-sticky-scroll::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      .cal-nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .cal-nav-btn {
        background: var(--card-inner);
        border: 1.5px solid var(--border-color);
        color: var(--text-color);
        border-radius: 5px;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .cal-nav-btn:hover {
        background: var(--badge-bg);
      }
      .cal-weekdays-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: calc(9px * var(--font-scale));
        font-weight: 800;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      .cal-days-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .cal-day-cell {
        min-height: 24px;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: calc(10.5px * var(--font-scale));
        font-weight: 700;
        cursor: pointer;
        position: relative;
        border: 1px solid transparent;
        background: var(--card-bg);
        color: var(--text-color);
        padding: 1px 0;
      }
      .cal-day-cell:hover {
        background: var(--item-hover);
      }
      .cal-day-cell.not-current-month {
        opacity: 0.35;
      }
      .cal-day-cell.today {
        border-color: #e6a15c !important;
        font-weight: 900;
        box-shadow: inset 0 0 0 1px #e6a15c;
      }
      .cal-day-cell.selected {
        background: var(--badge-bg) !important;
        border-color: var(--accent-color) !important;
      }
      .cal-dots {
        display: flex;
        flex-direction: row;
        gap: 3px;
        align-items: center;
        justify-content: center;
        height: 5px;
        margin-top: 1px;
      }
      .dot-quest {
        width: 4.5px;
        height: 4.5px;
        border-radius: 50%;
        background: #2a9d8f;
      }
      .dot-holiday {
        width: 4.5px;
        height: 4.5px;
        border-radius: 50%;
        background: #e63946;
      }
      .dot-bday {
        font-size: 7px;
        line-height: 1;
        color: #f59e0b;
      }
      .upcoming-item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px;
        border-radius: 5px;
        font-size: calc(10.5px * var(--font-scale));
        background: var(--card-bg);
        border: 1px solid var(--border-color);
      }
      .upcoming-badge {
        font-size: calc(8.5px * var(--font-scale));
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--accent-color);
        color: #ffffff;
      }
    </style>
  </head>
  <body data-theme="custard">
    <div class="sticky-card">
      <div class="sticky-header">
        <div class="header-title">
          <span class="icon">🍮</span>
          <span>Usagi Quests</span>
        </div>
        <div class="header-actions">
          <button
            id="windowSizeBtn"
            class="btn-icon"
            title="Cycle Window Size"
            style="font-size: 13px"
          >
            ⤢
          </button>
          <button
            id="textZoomBtn"
            class="btn-icon"
            title="Change Text Size"
            style="
              width: auto;
              padding: 0 6px;
              font-size: 11px;
              font-weight: 800;
              border: 1.5px solid var(--border-color);
            "
          >
            A+
          </button>
          <button id="minimizeBtn" class="btn-icon" title="Hide Note">✕</button>
        </div>
      </div>

      <!-- 3-Tab Switcher -->
      <div class="sticky-tabs">
        <button class="sticky-tab-btn active" id="tabBtnQuests">Quests</button>
        <button class="sticky-tab-btn" id="tabBtnCalendar">Calendar</button>
        <button class="sticky-tab-btn" id="tabBtnSchedule">Schedule</button>
      </div>

      <!-- Tab 1: Quests View -->
      <div class="view-container" id="viewQuests">
        <div class="input-bar">
          <input
            id="questInput"
            type="text"
            class="input-text"
            placeholder="Add quest (e.g. Submit exam 15/11)..."
            maxlength="120"
          />
          <button id="addQuestBtn" class="btn-add">+</button>
        </div>

        <div
          id="stickySelectedDateRow"
          style="
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: var(--card-inner);
            border-bottom: 1.5px dashed var(--border-color);
            font-size: 10px;
            font-weight: 700;
            color: var(--text-color);
          "
        >
          <span id="stickySelectedDateLabel">Target Date: --</span>
          <button
            id="stickyChipClearDate"
            class="sticky-chip-btn"
            style="padding: 1px 6px; font-size: 10px"
          >
            ✕ Clear Date
          </button>
        </div>

        <div id="questList" class="quest-list">
          <!-- Rendered items -->
        </div>

        <div class="sticky-footer">
          <span id="questCounter">0/0 completed</span>
          <button id="clearDoneBtn" class="btn-clear">Clear Done</button>
        </div>
      </div>

      <!-- Tab 2: Calendar View -->
      <div class="view-container" id="viewCalendar" style="display: none">
        <div class="cal-sticky-scroll">
          <div class="cal-nav-bar">
            <button class="cal-nav-btn" id="stickyCalPrevBtn">‹</button>
            <span
              id="stickyCalMonthTitle"
              style="
                font-weight: 800;
                font-size: calc(11px * var(--font-scale));
                color: var(--text-color);
              "
              >November 2026</span
            >
            <div style="display: flex; gap: 4px">
              <button
                class="cal-nav-btn"
                id="stickyCalTodayBtn"
                style="
                  font-size: calc(9px * var(--font-scale));
                  padding: 2px 6px;
                  width: auto;
                  font-weight: 700;
                "
              >
                Today
              </button>
              <button class="cal-nav-btn" id="stickyCalNextBtn">›</button>
            </div>
          </div>
          <div class="cal-weekdays-grid" id="stickyCalWeekdaysGrid">
            <div>Mo</div>
            <div>Tu</div>
            <div>We</div>
            <div>Th</div>
            <div>Fr</div>
            <div>Sa</div>
            <div>Su</div>
          </div>
          <div id="stickyCalDaysGrid" class="cal-days-grid">
            <!-- 42 day cells -->
          </div>

          <!-- Section A: Dedicated Selected Day Card -->
          <div
            id="stickyCalDetailBanner"
            style="
              display: none;
              padding: 6px 8px;
              border-radius: 8px;
              font-size: calc(10px * var(--font-scale));
              background: var(--card-inner);
              border: 1.5px dashed var(--border-color);
              flex-direction: column;
              gap: 4px;
              margin-top: 4px;
            "
          >
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span id="stickyCalDetailText" style="font-weight: 800; color: var(--text-color)"
                >Selected Date</span
              >
              <button
                id="stickyCalJumpAddBtn"
                class="sticky-chip-btn"
                style="padding: 1px 6px; font-size: calc(9.5px * var(--font-scale))"
              >
                + Add Quest
              </button>
            </div>
            <div
              id="stickyCalDayItemsList"
              style="
                display: flex;
                flex-direction: column;
                gap: 3px;
                max-height: 110px;
                overflow-y: auto;
              "
            >
              <!-- Items on this selected date -->
            </div>
          </div>

          <!-- Section B: Upcoming Countdown Feed (Excludes Selected Day) -->
          <div style="margin-top: 6px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 4px;
                font-size: 10px;
                font-weight: 800;
                color: var(--text-color);
              "
            >
              <span>Upcoming (This & Next Month)</span>
              <span style="font-size: 9px; opacity: 0.7">Countdown</span>
            </div>
            <div id="stickyUpcomingList" style="display: flex; flex-direction: column; gap: 3px">
              <!-- Upcoming items -->
            </div>
          </div>
        </div>
      </div>

      <!-- Tab 3: Schedule View (Timetable) -->
      <div class="view-container" id="viewSchedule" style="display: none">
        <!-- Now / Next Banner -->
        <div
          id="stickyScheduleNowBanner"
          style="
            padding: 6px 8px;
            background: var(--card-inner);
            border-bottom: 1.5px dashed var(--border-color);
            font-size: calc(10px * var(--font-scale));
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <span id="stickyScheduleNowText">Loading schedule...</span>
        </div>

        <!-- 7-Day Weekday Pill Bar -->
        <div
          class="sticky-chip-row"
          id="stickySchedDaysRow"
          style="justify-content: space-between; padding: 4px 6px"
        >
          <button class="sticky-chip-btn" data-day="1">Mon</button>
          <button class="sticky-chip-btn" data-day="2">Tue</button>
          <button class="sticky-chip-btn" data-day="3">Wed</button>
          <button class="sticky-chip-btn" data-day="4">Thu</button>
          <button class="sticky-chip-btn" data-day="5">Fri</button>
          <button class="sticky-chip-btn" data-day="6">Sat</button>
          <button class="sticky-chip-btn" data-day="0">Sun</button>
        </div>

        <!-- Class List for selected day -->
        <div id="stickyScheduleList" class="quest-list" style="padding: 6px 8px; gap: 5px">
          <!-- Schedule items for that day -->
        </div>

        <!-- Quick Add Form -->
        <div class="sticky-footer" style="flex-direction: column; gap: 5px; padding: 6px 8px">
          <div style="display: flex; gap: 4px; width: 100%">
            <input
              id="schedStartInput"
              type="time"
              class="input-text"
              value="09:00"
              style="padding: 3px 5px; font-size: calc(10px * var(--font-scale)); flex: 0 0 62px"
            />
            <span
              style="
                font-weight: 800;
                align-self: center;
                font-size: calc(10px * var(--font-scale));
              "
              >–</span
            >
            <input
              id="schedEndInput"
              type="time"
              class="input-text"
              value="10:30"
              style="padding: 3px 5px; font-size: calc(10px * var(--font-scale)); flex: 0 0 62px"
            />
            <input
              id="schedLocationInput"
              type="text"
              class="input-text"
              placeholder="Room/Note"
              maxlength="30"
              style="
                padding: 3px 5px;
                font-size: calc(10px * var(--font-scale));
                flex: 1;
                min-width: 0;
              "
            />
          </div>
          <div style="display: flex; gap: 4px; width: 100%">
            <input
              id="schedTitleInput"
              type="text"
              class="input-text"
              placeholder="Course / Study title..."
              maxlength="60"
              style="padding: 3px 5px; font-size: calc(11px * var(--font-scale)); flex: 1"
            />
            <button id="addSchedBtn" class="btn-add" style="padding: 0 10px; font-size: 12px">
              +
            </button>
          </div>
        </div>
      </div>

      <!-- Interactive Resize Edges & Corner Grip -->
      <div id="stickyResizeRight" class="sticky-resize-edge-right"></div>
      <div id="stickyResizeBottom" class="sticky-resize-edge-bottom"></div>
      <div id="stickyResizeCorner" class="sticky-resize-corner" title="Drag to resize">
        <svg
          class="sticky-resize-grip"
          viewBox="0 0 10 10"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <line
            x1="8"
            y1="2"
            x2="2"
            y2="8"
            stroke="var(--border-color)"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <line
            x1="8"
            y1="5.5"
            x2="5.5"
            y2="8"
            stroke="var(--border-color)"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

    <script type="module" src="./sticky.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background:
          radial-gradient(1200px 900px at 78% 8%, rgba(255, 118, 117, 0.30), transparent 62%),
          radial-gradient(1000px 800px at 12% 92%, rgba(255, 234, 167, 0.22), transparent 60%),
          radial-gradient(900px 700px at 4% 6%, rgba(108, 92, 231, 0.34), transparent 58%),
          linear-gradient(150deg, #1b1430 0%, #241a38 42%, #170f24 100%);
        position: relative;
      }
      /* soft dot grid */
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.10) 1.4px, transparent 1.4px);
        background-size: 34px 34px;
        mask-image: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.85), transparent 78%);
        -webkit-mask-image: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.85), transparent 78%);
        opacity: 0.55;
      }
      /* drifting blobs for life */
      .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; }
      .b1 { width: 620px; height: 620px; left: -140px; top: 42%; background: rgba(255,118,117,0.30); animation: drift1 26s ease-in-out infinite alternate; }
      .b2 { width: 540px; height: 540px; right: -120px; top: 12%; background: rgba(255,234,167,0.24); animation: drift2 31s ease-in-out infinite alternate; }
      .b3 { width: 460px; height: 460px; left: 46%; bottom: -180px; background: rgba(108,92,231,0.34); animation: drift3 23s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(90px, -60px) scale(1.12); } }
      @keyframes drift2 { to { transform: translate(-70px, 80px) scale(1.08); } }
      @keyframes drift3 { to { transform: translate(60px, -50px) scale(1.15); } }
      /* vignette */
      .vig {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 48%, transparent 46%, rgba(8, 5, 14, 0.62) 100%);
      }
      /* faint brand mark, bottom-right */
      .mark {
        position: absolute; right: 46px; bottom: 40px;
        display: flex; align-items: center; gap: 12px;
        font: 600 17px/1 "SF Pro Display", -apple-system, sans-serif;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(255,255,255,0.26);
      }
      .mark span.dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,118,117,0.75); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="vig"></div>
    <div class="mark"><span class="dot"></span>usagi buddy</div>
  </body>
</html>

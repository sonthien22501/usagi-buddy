<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        position: absolute; left: 0; right: 0; bottom: 178px;
        display: flex; flex-direction: column; align-items: center;
      }
      .pill {
        display: inline-flex; align-items: center; gap: 16px;
        padding: 17px 36px 17px 28px;
        border-radius: 26px;
        background: rgba(22, 15, 32, 0.80);
        border: 1px solid rgba(255, 234, 167, 0.22);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(26px) saturate(160%);
        -webkit-backdrop-filter: blur(26px) saturate(160%);
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        transition: opacity 500ms cubic-bezier(0.22, 1, 0.36, 1),
                    transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
        max-width: 76vw;
      }
      .pill.on { opacity: 1; transform: translateY(0) scale(1); }
      .accent {
        width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
        background: linear-gradient(140deg, #ff7675, #ffeaa7);
        box-shadow: 0 0 18px rgba(255, 118, 117, 0.95);
      }
      .col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .text {
        font-size: 26px; font-weight: 600; letter-spacing: -0.012em;
        color: #fdf7ee; white-space: nowrap;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      }
      .sub {
        font-size: 15.5px; font-weight: 500; letter-spacing: 0.05em;
        color: rgba(255, 234, 167, 0.72); white-space: nowrap;
        text-transform: uppercase;
        max-height: 0; opacity: 0;
        transition: max-height 380ms ease, opacity 380ms ease;
        overflow: hidden;
      }
      .sub.on { max-height: 24px; opacity: 1; }

      /* ---------- opening title card ---------- */
      .intro {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        opacity: 0; transform: scale(0.96);
        transition: opacity 700ms ease, transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }
      .intro.on { opacity: 1; transform: scale(1); }
      .intro img {
        width: 148px; height: 148px;
        filter: drop-shadow(0 18px 46px rgba(255, 118, 117, 0.55));
        animation: bob 3.4s ease-in-out infinite alternate;
      }
      @keyframes bob {
        from { transform: translateY(-6px) rotate(-1.5deg); }
        to   { transform: translateY(8px) rotate(1.5deg); }
      }
      .intro h1 {
        font-size: 64px; font-weight: 700; letter-spacing: -0.03em;
        color: #fdf7ee;
        text-shadow: 0 10px 44px rgba(0, 0, 0, 0.6), 0 0 70px rgba(255, 118, 117, 0.35);
      }
      .intro p {
        font-size: 19px; font-weight: 500; letter-spacing: 0.22em;
        text-transform: uppercase; color: rgba(255, 234, 167, 0.82);
      }
    </style>
  </head>
  <body>
    <div class="intro" id="intro">
      <img src="../../assets/Usagi_logo.png" alt="" />
      <h1>Usagi Buddy</h1>
      <p>your desktop companion</p>
    </div>
    <div class="wrap">
      <div class="pill" id="pill">
        <span class="accent"></span>
        <span class="col">
          <span class="text" id="text"></span>
          <span class="sub" id="sub"></span>
        </span>
      </div>
    </div>
    <script>
      const pill = document.getElementById('pill');
      const text = document.getElementById('text');
      const sub = document.getElementById('sub');

      window.caption = (main, secondary) => {
        text.textContent = main;
        pill.classList.add('on');
        if (secondary) {
          sub.textContent = secondary;
          sub.classList.add('on');
        } else {
          sub.classList.remove('on');
        }
      };

      window.captionOff = () => {
        pill.classList.remove('on');
        sub.classList.remove('on');
      };

      const intro = document.getElementById('intro');
      window.intro = (show) => {
        intro.classList.toggle('on', Boolean(show));
      };
    </script>
  </body>
</html>
